[project]
name = "api"
version = "0.1.0"
description = "Outage Map API using Robyn"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "robyn>=0.60.0",
    "sqlalchemy>=2.0.0",
    "geoalchemy2>=0.14.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "db",
]

[tool.uv.sources]
db = { path = "../../packages/db", editable = true }

[tool.uv]
managed = true
