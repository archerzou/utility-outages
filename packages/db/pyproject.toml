[project]
name = "db"
version = "0.1.0"
description = "Shared logic and models for utility outage apps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.0",
    "geoalchemy2>=0.14.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
managed = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
